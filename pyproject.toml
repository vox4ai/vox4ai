[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vox4ai"
version = "0.1.0"
description = "TTS 音声合成 CLI - vox / vox4ai コマンド"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "vox4ai", email = "vox4ai@example.com"},
]
keywords = ["tts", "tts-plugin-bridge", "edgetts", "voice", "speech", "synthesis", "cli", "vox4ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "tts-plugin-bridge",
    "tts-plugin-edgetts",
    "vox4ai-skill-lib",
    "pyyaml>=6.0",
    "pydantic-settings>=2.14.1",
]

[project.urls]
Homepage = "https://github.com/vox4ai/vox4ai"
Repository = "https://github.com/vox4ai/vox4ai"
Issues = "https://github.com/vox4ai/vox4ai/issues"

[project.scripts]
vox = "vox4ai.cli:main"
vox4ai = "vox4ai.cli:main"

[tool.uv.sources]
tts-plugin-bridge = { path = "../tts-plugin-bridge", editable = true }
tts-plugin-edgetts = { path = "../tts-plugin-edgetts", editable = true }
vox4ai-skill-lib = { path = "../vox4ai-skill-lib", editable = true }

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.12",
    "twine>=6.2.0",
]

[tool.coverage.run]
source = ["vox4ai"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50

[tool.mutmut]
paths_to_mutate = ["src/vox4ai/config.py"]
tests_dir = ["tests/test_config.py"]
backup = false
